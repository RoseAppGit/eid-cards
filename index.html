<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121826">
  <title>PromptVaultAI.net | مولد كروت عيد الأضحى</title>
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --page-bg: #10141f;
      --panel-bg: rgba(255, 255, 255, 0.09);
      --panel-border: rgba(255, 255, 255, 0.16);
      --panel-text: #f7f1e5;
      --panel-muted: rgba(247, 241, 229, 0.72);
      --control-bg: rgba(255, 255, 255, 0.12);
      --control-border: rgba(255, 255, 255, 0.2);
      --control-focus: #e8c76a;
      --button-bg: #e8c76a;
      --button-text: #16120a;
      --danger: #ffb1b1;
      --success: #b8f5cd;
      --font-ui: "Segoe UI", Tahoma, Arial, sans-serif;
      --font-display: "Aref Ruqaa", "Amiri", "Times New Roman", serif;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--page-bg);
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: var(--font-ui);
      color: var(--panel-text);
      background:
        radial-gradient(circle at 15% 10%, rgba(232, 199, 106, 0.18), transparent 26rem),
        radial-gradient(circle at 90% 15%, rgba(88, 178, 177, 0.16), transparent 24rem),
        linear-gradient(135deg, #0c111b, #1f1722 48%, #112124);
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    input,
    textarea {
      font-size: 16px;
      direction: rtl;
      unicode-bidi: plaintext;
      -webkit-user-select: text;
      user-select: text;
      touch-action: manipulation;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 12px 28px;
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      min-width: 0;
      padding: 14px 0 18px;
    }

    .brand-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.65rem, 4.4vw, 3.2rem);
      line-height: 1.1;
      color: #fff8df;
      overflow-wrap: anywhere;
    }

    .brand-subtitle {
      margin: 7px 0 0;
      color: var(--panel-muted);
      font-size: clamp(0.92rem, 2.5vw, 1.05rem);
    }

    .brand-badge {
      justify-self: end;
      padding: 10px 13px;
      border: 1px solid rgba(232, 199, 106, 0.46);
      border-radius: 999px;
      color: #f5d979;
      background: rgba(18, 18, 22, 0.44);
      font-weight: 800;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(310px, 420px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
      direction: rtl;
      min-width: 0;
    }

    .control-panel {
      position: sticky;
      top: 14px;
      z-index: 5;
      display: grid;
      gap: 14px;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      padding: 16px;
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(18px);
    }

    .panel-section {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0;
      color: #fff8df;
      font-size: 1rem;
      font-weight: 900;
    }

    .theme-counter {
      color: #f4d77e;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .field-group {
      display: grid;
      gap: 7px;
    }

    .field-label {
      color: var(--panel-muted);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .text-field,
    .message-field {
      width: 100%;
      position: relative;
      z-index: 2;
      border: 1px solid var(--control-border);
      border-radius: 14px;
      color: #fff;
      background: var(--control-bg);
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .text-field {
      min-height: 54px;
      padding: 0 13px;
    }

    .message-field {
      min-height: 128px;
      padding: 12px 13px;
      resize: vertical;
      line-height: 1.65;
    }

    .text-field:focus,
    .message-field:focus {
      border-color: var(--control-focus);
      box-shadow: 0 0 0 4px rgba(232, 199, 106, 0.18);
      background: rgba(255, 255, 255, 0.16);
    }

    .file-drop {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 11px;
      align-items: center;
      min-height: 74px;
      padding: 10px;
      border: 1px dashed rgba(232, 199, 106, 0.46);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      min-width: 0;
    }

    .file-preview {
      width: 58px;
      height: 58px;
      border: 2px solid rgba(232, 199, 106, 0.55);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.28), transparent 18px),
        linear-gradient(145deg, rgba(232, 199, 106, 0.42), rgba(23, 31, 43, 0.5));
      overflow: hidden;
    }

    .file-preview img {
      width: 100%;
      height: 100%;
      display: none;
      object-fit: cover;
    }

    .file-drop-text {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .file-drop strong {
      color: #fff8df;
      font-size: 0.94rem;
    }

    .file-drop span {
      color: var(--panel-muted);
      font-size: 0.83rem;
      line-height: 1.45;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .theme-chip {
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 13px;
      color: rgba(255, 255, 255, 0.82);
      background: rgba(255, 255, 255, 0.08);
      font-weight: 900;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease;
    }

    .theme-chip:hover,
    .theme-chip.is-active {
      color: #17120a;
      border-color: rgba(232, 199, 106, 0.84);
      background: #e8c76a;
      transform: translateY(-1px);
    }

    .quick-actions,
    .export-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      min-width: 0;
    }

    .action-button {
      min-height: 48px;
      padding: 0 13px;
      border-radius: 14px;
      color: var(--button-text);
      background: var(--button-bg);
      font-weight: 900;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.16);
      transition: transform 160ms ease, filter 160ms ease;
    }

    .action-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .action-button.secondary {
      color: #fff8df;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.11);
      box-shadow: none;
    }

    .status-message {
      min-height: 22px;
      margin: 0;
      color: var(--panel-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .status-message.is-error {
      color: var(--danger);
    }

    .status-message.is-success {
      color: var(--success);
    }

    .preview-area {
      display: grid;
      place-items: start center;
      min-width: 0;
      padding: 8px 0 32px;
      direction: rtl;
    }

    .phone-frame {
      width: min(430px, 100%);
      padding: clamp(8px, 2.4vw, 13px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 34px;
      background: rgba(0, 0, 0, 0.2);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    }

    .eid-card {
      --card-bg: linear-gradient(160deg, #151a35, #06111e 58%, #141827);
      --card-ink: #fff7df;
      --card-muted: rgba(255, 247, 223, 0.78);
      --card-gold: #e8c76a;
      --card-accent: #55c8bc;
      --card-border: rgba(232, 199, 106, 0.9);
      --inner-border: rgba(255, 255, 255, 0.16);
      --photo-radius: 50%;
      --photo-size: 38%;
      --photo-y: 0%;
      --sheep-x: -38%;
      --sheep-y: 83.5%;
      --sheep-size: 18%;
      --title-top: 7%;
      --name-top: 66.2%;
      --message-top: 74.2%;
      --signature-bottom: 3.2%;
      position: relative;
      isolation: isolate;
      width: 100%;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border: 2px solid var(--card-border);
      border-radius: var(--card-radius, 30px);
      color: var(--card-ink);
      background: var(--card-bg);
      box-shadow: inset 0 0 0 1px var(--inner-border), 0 28px 80px rgba(0, 0, 0, 0.38);
      transform: translateZ(0);
    }

    .eid-card::before,
    .eid-card::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .eid-card::before {
      inset: 3.4%;
      border: 1px solid var(--frame-line, rgba(232, 199, 106, 0.36));
      border-radius: calc(var(--card-radius, 30px) - 12px);
    }

    .eid-card::after {
      inset: 0;
      background: var(--card-overlay, transparent);
      opacity: var(--overlay-opacity, 1);
      mix-blend-mode: var(--overlay-blend, normal);
    }

    .theme-art,
    .deco,
    .photo-frame,
    .sheep-mark,
    .card-copy,
    .brand-signature {
      position: absolute;
      z-index: 2;
    }

    .deco {
      color: var(--card-gold);
      opacity: 0.86;
      pointer-events: none;
    }

    .deco-crescent {
      width: 18%;
      aspect-ratio: 1;
      border-radius: 50%;
      box-shadow: -14px 0 0 2px currentColor;
      transform: rotate(-18deg);
    }

    .deco-star {
      width: 12px;
      height: 12px;
      background: currentColor;
      clip-path: polygon(50% 0, 61% 34%, 98% 35%, 68% 56%, 79% 91%, 50% 70%, 21% 91%, 32% 56%, 2% 35%, 39% 34%);
      filter: drop-shadow(0 0 8px currentColor);
    }

    .deco-lantern {
      width: 12%;
      height: 14%;
      border: 2px solid currentColor;
      border-radius: 45% 45% 18% 18%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent);
    }

    .deco-lantern::before,
    .deco-lantern::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: currentColor;
    }

    .deco-lantern::before {
      top: -17%;
      width: 46%;
      height: 18%;
      border-radius: 999px 999px 0 0;
    }

    .deco-lantern::after {
      bottom: 14%;
      width: 2px;
      height: 58%;
      opacity: 0.8;
    }

    .deco-1 { top: 5%; right: 8%; }
    .deco-2 { top: 10%; left: 12%; transform: scale(1.15) rotate(14deg); }
    .deco-3 { top: 23%; right: 15%; transform: scale(0.8); }
    .deco-4 { bottom: 19%; left: 12%; transform: scale(0.9) rotate(-9deg); }
    .deco-5 { bottom: 8%; right: 15%; transform: scale(1.2) rotate(10deg); }

    .theme-art {
      display: none;
      pointer-events: none;
      z-index: 1;
    }

    .art-kaaba {
      width: 34%;
      height: 19%;
      right: 8%;
      bottom: 10%;
      border-radius: 8px 8px 3px 3px;
      background:
        linear-gradient(90deg, transparent 11%, rgba(232, 199, 106, 0.9) 11% 18%, transparent 18% 82%, rgba(232, 199, 106, 0.9) 82% 89%, transparent 89%),
        linear-gradient(#15100b 0 35%, #c9a33c 35% 44%, #070707 44%);
      box-shadow: 0 20px 38px rgba(0, 0, 0, 0.34);
    }

    .art-mosque {
      inset-inline: 0;
      bottom: 0;
      height: 24%;
      opacity: 0.7;
      background:
        radial-gradient(circle at 50% 26%, currentColor 0 18%, transparent 18.5%),
        radial-gradient(circle at 26% 42%, currentColor 0 12%, transparent 12.5%),
        radial-gradient(circle at 74% 42%, currentColor 0 12%, transparent 12.5%),
        linear-gradient(to top, currentColor 0 48%, transparent 48%);
      color: var(--silhouette, rgba(0, 0, 0, 0.32));
      clip-path: polygon(0 100%, 0 55%, 16% 55%, 16% 37%, 22% 37%, 22% 55%, 34% 55%, 34% 39%, 39% 39%, 39% 55%, 61% 55%, 61% 39%, 66% 39%, 66% 55%, 78% 55%, 78% 37%, 84% 37%, 84% 55%, 100% 55%, 100% 100%);
    }

    .art-dunes {
      inset-inline: -2%;
      bottom: -1%;
      height: 27%;
      background:
        radial-gradient(90% 70% at 18% 70%, rgba(255, 230, 157, 0.7), transparent 62%),
        radial-gradient(100% 82% at 80% 78%, rgba(175, 89, 50, 0.58), transparent 60%),
        linear-gradient(180deg, transparent, rgba(80, 36, 19, 0.54));
      clip-path: ellipse(74% 44% at 50% 78%);
    }

    .art-floral {
      width: 72%;
      height: 27%;
      left: -11%;
      top: 4%;
      opacity: 0.72;
      background:
        radial-gradient(circle at 20% 50%, #ef8ca1 0 6%, transparent 6.5%),
        radial-gradient(circle at 36% 28%, #f7c0c8 0 5%, transparent 5.5%),
        radial-gradient(circle at 54% 58%, #d86f88 0 5%, transparent 5.5%),
        radial-gradient(circle at 68% 32%, #f0c36f 0 4.6%, transparent 5%),
        linear-gradient(120deg, transparent 47%, rgba(91, 138, 83, 0.72) 48% 51%, transparent 52%);
      transform: rotate(-12deg);
    }

    .art-majlis {
      inset: auto 6% 6% 6%;
      height: 20%;
      border-radius: 16px;
      background:
        repeating-linear-gradient(45deg, rgba(232, 199, 106, 0.42) 0 7px, transparent 7px 16px),
        linear-gradient(135deg, rgba(89, 20, 32, 0.88), rgba(31, 12, 20, 0.82));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .art-story {
      inset: 0;
      display: none;
      background:
        linear-gradient(142deg, transparent 0 22%, rgba(255, 255, 255, 0.16) 22.2% 34%, transparent 34.2%),
        linear-gradient(-26deg, transparent 0 54%, rgba(255, 207, 83, 0.22) 54.2% 68%, transparent 68.2%);
    }

    .art-corporate {
      width: 84%;
      height: 48%;
      right: 8%;
      top: 12%;
      border: 1px solid rgba(20, 42, 55, 0.1);
      border-radius: 28px;
      background:
        linear-gradient(90deg, rgba(28, 92, 99, 0.12) 1px, transparent 1px),
        linear-gradient(rgba(28, 92, 99, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .photo-frame {
      top: calc(43.5% + var(--photo-y));
      left: 50%;
      width: var(--photo-size);
      aspect-ratio: 1;
      padding: var(--photo-padding, 7px);
      border: var(--photo-border-width, 3px) solid var(--photo-border, var(--card-gold));
      border-radius: var(--photo-radius);
      background: var(--photo-bg, rgba(255, 255, 255, 0.16));
      box-shadow: var(--photo-shadow, 0 18px 42px rgba(0, 0, 0, 0.32));
      transform: translate(-50%, -50%) rotate(var(--photo-rotate, 0deg));
      overflow: hidden;
    }

    .photo-frame::before {
      content: "";
      position: absolute;
      inset: -12%;
      border-radius: inherit;
      background: conic-gradient(from 120deg, transparent, rgba(255, 255, 255, 0.44), transparent 28%);
      opacity: var(--photo-glow, 0.42);
      animation: softSpin 10s linear infinite;
    }

    .photo-frame img,
    .photo-placeholder {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: inherit;
    }

    .photo-frame img {
      display: none;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.2);
    }

    .photo-placeholder {
      display: grid;
      place-items: center;
      padding: 18px;
      text-align: center;
      color: var(--card-muted);
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 255, 255, 0.34), transparent 22%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(0, 0, 0, 0.16));
      font-size: clamp(0.8rem, 3.5vw, 1.06rem);
      font-weight: 900;
      line-height: 1.45;
    }

    .sheep-mark {
      width: var(--sheep-size);
      left: calc(50% + var(--sheep-x));
      top: var(--sheep-y);
      color: var(--sheep-wool, #fff4df);
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.24));
      transform: rotate(var(--sheep-rotate, -4deg));
    }

    .sheep-mark svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .card-copy {
      left: 8%;
      right: 8%;
      text-align: center;
      text-wrap: balance;
    }

    .card-title-block {
      top: var(--title-top);
    }

    .card-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.85rem, 8.8vw, 3.05rem);
      line-height: 1.02;
      color: var(--title-color, var(--card-ink));
      text-shadow: var(--title-shadow, 0 3px 18px rgba(0, 0, 0, 0.26));
    }

    .card-year {
      margin: 0.28rem 0 0;
      color: var(--year-color, var(--card-gold));
      font-size: clamp(0.86rem, 3.25vw, 1.08rem);
      font-weight: 900;
    }

    .card-name {
      top: var(--name-top);
      font-family: var(--font-display);
      font-size: clamp(1.38rem, 6.2vw, 2.35rem);
      font-weight: 900;
      line-height: 1.15;
      color: var(--name-color, var(--card-gold));
      text-shadow: var(--name-shadow, 0 3px 16px rgba(0, 0, 0, 0.24));
    }

    .card-message {
      top: var(--message-top);
      display: -webkit-box;
      max-height: 15.8%;
      overflow: hidden;
      color: var(--message-color, var(--card-muted));
      font-size: clamp(0.86rem, 3.25vw, 1.04rem);
      font-weight: 700;
      line-height: 1.65;
      white-space: pre-line;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .brand-signature {
      left: 50%;
      bottom: var(--signature-bottom);
      padding: 0.38rem 0.75rem;
      border: 1px solid var(--signature-border, rgba(255, 255, 255, 0.18));
      border-radius: 999px;
      color: var(--signature-color, rgba(255, 255, 255, 0.72));
      background: var(--signature-bg, rgba(0, 0, 0, 0.16));
      font-size: clamp(0.68rem, 2.7vw, 0.82rem);
      font-weight: 900;
      letter-spacing: 0;
      transform: translateX(-50%);
      white-space: nowrap;
      z-index: 3;
    }

    @keyframes softSpin {
      to { transform: rotate(360deg); }
    }

    .theme-royal-night {
      --card-bg:
        radial-gradient(circle at 50% 25%, rgba(65, 93, 154, 0.42), transparent 32%),
        radial-gradient(circle at 12% 83%, rgba(232, 199, 106, 0.14), transparent 28%),
        linear-gradient(160deg, #18224b, #061320 58%, #100d21);
      --card-border: #e4c364;
      --frame-line: rgba(232, 199, 106, 0.52);
      --photo-radius: 50%;
      --photo-size: 44%;
      --sheep-x: -24%;
      --sheep-y: 57%;
      --silhouette: rgba(5, 8, 18, 0.24);
    }

    .theme-kaaba-luxury {
      --card-bg:
        linear-gradient(90deg, rgba(214, 175, 78, 0.13) 1px, transparent 1px),
        linear-gradient(180deg, rgba(214, 175, 78, 0.11) 1px, transparent 1px),
        radial-gradient(circle at 50% 20%, rgba(232, 199, 106, 0.22), transparent 30%),
        linear-gradient(160deg, #050505, #181004 56%, #020202);
      --card-ink: #fff4d2;
      --card-muted: rgba(255, 238, 190, 0.78);
      --card-gold: #f3cf72;
      --card-border: #d9ad47;
      --photo-radius: 18px;
      --photo-size: 42%;
      --photo-rotate: 2deg;
      --sheep-x: -25%;
      --sheep-y: 57.5%;
      --signature-bg: rgba(217, 173, 71, 0.15);
      background-size: 34px 34px, 34px 34px, auto, auto;
    }

    .theme-kaaba-luxury .art-kaaba { display: block; }

    .theme-white-gold {
      --card-bg:
        linear-gradient(135deg, rgba(218, 175, 62, 0.16) 25%, transparent 25%) 0 0 / 42px 42px,
        linear-gradient(225deg, rgba(218, 175, 62, 0.11) 25%, transparent 25%) 0 0 / 42px 42px,
        linear-gradient(180deg, #fffdf5, #f5ebd2);
      --card-ink: #2b2518;
      --card-muted: rgba(43, 37, 24, 0.72);
      --card-gold: #b78925;
      --card-border: #caa447;
      --inner-border: rgba(183, 137, 37, 0.24);
      --frame-line: rgba(183, 137, 37, 0.34);
      --photo-radius: 32px;
      --photo-size: 43%;
      --photo-bg: rgba(183, 137, 37, 0.12);
      --title-shadow: none;
      --name-shadow: none;
      --signature-color: rgba(43, 37, 24, 0.7);
      --signature-bg: rgba(183, 137, 37, 0.08);
    }

    .theme-green-pattern {
      --card-bg:
        radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.08) 0 4px, transparent 5px) 0 0 / 28px 28px,
        repeating-linear-gradient(45deg, rgba(232, 199, 106, 0.09) 0 2px, transparent 2px 16px),
        linear-gradient(155deg, #063f36, #0f6a4d 48%, #07392e);

      "use strict";

      const themes = [
        { name: "Royal Eid Night", className: "theme-royal-night" },
        { name: "Golden Kaaba Luxury", className: "theme-kaaba-luxury" },
        { name: "White & Gold Minimal", className: "theme-white-gold" },
        { name: "Green Islamic Pattern", className: "theme-green-pattern" },
        { name: "Desert Eid Sunset", className: "theme-desert-sunset" },
        { name: "Cute Eid Sheep", className: "theme-cute-sheep" },
        { name: "Kids Eid Celebration", className: "theme-kids-celebration" },
        { name: "Luxury Black Gold", className: "theme-black-gold" },
        { name: "Blue Mosque Night", className: "theme-blue-mosque" },
        { name: "Arabian Majlis", className: "theme-arabian-majlis" },
        { name: "Modern Gradient Eid", className: "theme-modern-gradient" },
        { name: "Floral Eid Blessing", className: "theme-floral-blessing" },
        { name: "Crescent Moon Premium", className: "theme-crescent-premium" },
        { name: "Family Eid Card", className: "theme-family-card" },
        { name: "Soft Pastel Eid", className: "theme-pastel-eid" },
        { name: "Red Velvet Eid", className: "theme-red-velvet" },
        { name: "Emerald Gold Eid", className: "theme-emerald-gold" },
        { name: "Classic Arabic Calligraphy", className: "theme-calligraphy" },
        { name: "Social Media Story Eid", className: "theme-story" },
        { name: "Clean Corporate Eid", className: "theme-corporate" }
      ];

      const defaults = {
        name: "أحمد",
        message: "كل عام وأنتم بخير، أعاده الله عليكم بالخير والبركة والفرح.",
        themeIndex: 0
      };

      const dom = {
        card: document.getElementById("eidCard"),
        nameInput: document.getElementById("nameInput"),
        messageInput: document.getElementById("messageInput"),
        photoInput: document.getElementById("photoInput"),
        cardName: document.getElementById("cardName"),
        cardMessage: document.getElementById("cardMessage"),
        cardPhoto: document.getElementById("cardPhoto"),
        photoPlaceholder: document.getElementById("photoPlaceholder"),
        filePreview: document.getElementById("filePreview"),
        themeGrid: document.getElementById("themeGrid"),
        themeCounter: document.getElementById("themeCounter"),
        themeName: document.getElementById("themeName"),
        prevThemeButton: document.getElementById("prevThemeButton"),
        nextThemeButton: document.getElementById("nextThemeButton"),
        randomThemeButton: document.getElementById("randomThemeButton"),
        downloadButton: document.getElementById("downloadButton"),
        shareButton: document.getElementById("shareButton"),
        resetButton: document.getElementById("resetButton"),
        statusMessage: document.getElementById("statusMessage")
      };

      let currentThemeIndex = defaults.themeIndex;
      let statusTimer = 0;

      function setStatus(message, type = "info") {
        window.clearTimeout(statusTimer);
        dom.statusMessage.textContent = message;
        dom.statusMessage.classList.toggle("is-error", type === "error");
        dom.statusMessage.classList.toggle("is-success", type === "success");
        if (message) {
          statusTimer = window.setTimeout(() => {
            dom.statusMessage.textContent = "";
            dom.statusMessage.classList.remove("is-error", "is-success");
          }, type === "error" ? 5200 : 3200);
        }
      }

      function normalizeIndex(index) {
        return (index + themes.length) % themes.length;
      }

      function setTheme(index) {
        currentThemeIndex = normalizeIndex(index);
        const theme = themes[currentThemeIndex];
        dom.card.className = "eid-card " + theme.className;
        dom.themeCounter.textContent = String(currentThemeIndex + 1) + " / " + String(themes.length);
        dom.themeName.textContent = theme.name;
        const chips = dom.themeGrid.querySelectorAll(".theme-chip");
        chips.forEach((chip, chipIndex) => {
          chip.classList.toggle("is-active", chipIndex === currentThemeIndex);
          chip.setAttribute("aria-pressed", chipIndex === currentThemeIndex ? "true" : "false");
        });
      }

      function updatePreviewText() {
        const cleanName = dom.nameInput.value.trim() || defaults.name;
        const cleanMessage = dom.messageInput.value.trim() || defaults.message;
        dom.cardName.textContent = cleanName;
        dom.cardMessage.textContent = cleanMessage;
      }

      function buildThemeButtons() {
        const fragment = document.createDocumentFragment();
        themes.forEach((theme, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "theme-chip";
          button.textContent = String(index + 1);
          button.title = theme.name;
          button.setAttribute("aria-label", "اختيار تصميم " + theme.name);
          button.addEventListener("click", () => setTheme(index));
          fragment.appendChild(button);
        });
        dom.themeGrid.appendChild(fragment);
      }

      function loadImageElement(src) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error("تعذر قراءة الصورة."));
          image.src = src;
        });
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result));
          reader.onerror = () => reject(new Error("تعذر تحميل الملف."));
          reader.readAsDataURL(file);
        });
      }

      async function resizeImageFile(file) {
        const source = await readFileAsDataUrl(file);
        const image = await loadImageElement(source);
        const maxSide = 1600;
        const ratio = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
        const width = Math.max(1, Math.round(image.naturalWidth * ratio));
        const height = Math.max(1, Math.round(image.naturalHeight * ratio));

        if (ratio === 1 && file.size < 900000) {
          return source;
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d", { alpha: false });
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, width, height);
        context.drawImage(image, 0, 0, width, height);
        return canvas.toDataURL("image/jpeg", 0.9);
      }

      async function handlePhotoUpload(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) {
          return;
        }

        const allowedTypes = ["image/jpeg", "image/png", "image/webp"];
        if (!allowedTypes.includes(file.type)) {
          dom.photoInput.value = "";
          setStatus("الملف غير صالح. استخدم JPG أو PNG أو WEBP فقط.", "error");
          return;
        }

        try {
          setStatus("جاري تجهيز الصورة...");
          const resizedDataUrl = await resizeImageFile(file);
          dom.cardPhoto.src = resizedDataUrl;
          dom.cardPhoto.style.display = "block";
          dom.photoPlaceholder.style.display = "none";
          dom.filePreview.src = resizedDataUrl;
          dom.filePreview.style.display = "block";
          setStatus("تمت إضافة الصورة بنجاح.", "success");
        } catch (error) {
          dom.photoInput.value = "";
          setStatus(error.message || "حدث خطأ أثناء قراءة الصورة.", "error");
        }
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function canvasToBlob(canvas) {
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error("تعذر إنشاء ملف PNG."));
            }
          }, "image/png", 1);
        });
      }

      async function waitForFonts() {
        if (document.fonts && document.fonts.ready) {
          try {
            await document.fonts.ready;
          } catch (error) {
            return;
          }
        }
      }

      async function renderWithHtml2Canvas() {
        if (!window.html2canvas) {
          throw new Error("html2canvas غير متاح.");
        }

        const stage = document.createElement("div");
        const exportCard = dom.card.cloneNode(true);
        stage.className = "export-stage";
        stage.style.position = "fixed";
        stage.style.inset = "0 auto auto 0";
        stage.style.width = "1080px";
        stage.style.height = "1920px";
        stage.style.overflow = "hidden";
        stage.style.pointerEvents = "none";
        stage.style.zIndex = "-1";
        stage.style.background = "#ffffff";
        stage.appendChild(exportCard);
        document.body.appendChild(stage);

        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        try {
          return await window.html2canvas(exportCard, {
            backgroundColor: "#ffffff",
            scale: 1.5,
            width: 1080,
            height: 1920,
            windowWidth: 1080,
            windowHeight: 1920,
            useCORS: false,
            allowTaint: true,
            logging: false,
            imageTimeout: 0,
            removeContainer: true
          });
        } finally {
          stage.remove();
        }
      }

      async function renderFallbackCanvas() {
        const styleText = Array.from(document.querySelectorAll("style"))
          .map((style) => style.textContent || "")
          .join("\n");
        const clone = dom.card.cloneNode(true);
        const serializedCard = new XMLSerializer().serializeToString(clone);
        const svg = [
          '<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">',
          '<foreignObject width="1080" height="1920">',
          '<div xmlns="http://www.w3.org/1999/xhtml" class="export-stage">',
          '<style>',
          styleText.replace(/<\/style>/gi, ""),
          '</style>',
          serializedCard,
          '</div>',
          '</foreignObject>',
          '</svg>'
        ].join("");

        const image = await loadImageElement("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg));
        const canvas = document.createElement("canvas");
        canvas.width = 1080;
        canvas.height = 1920;
        const context = canvas.getContext("2d", { alpha: false });
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        return canvas;
      }

      async function downloadPng() {
        document.body.classList.add("is-exporting");
        dom.downloadButton.disabled = true;
        setStatus("جاري تجهيز ملف PNG عالي الجودة...");

        try {
          await waitForFonts();
          let canvas;
          try {
            canvas = await renderWithHtml2Canvas();
          } catch (error) {
            canvas = await renderFallbackCanvas();
          }
          const blob = await canvasToBlob(canvas);
          const safeName = (dom.nameInput.value.trim() || "eid-card").replace(/[\\/:*?"<>|]+/g, "-");
          downloadBlob(blob, "PromptVaultAI-Eid-Adha-" + safeName + ".png");
          setStatus("تم تحميل البطاقة بنجاح.", "success");
        } catch (error) {
          setStatus("تعذر التصدير الآن. جرّب متصفحًا حديثًا أو أعد فتح الصفحة.", "error");
        } finally {
          dom.downloadButton.disabled = false;
          document.body.classList.remove("is-exporting");
        }
      }

      async function shareCurrentLink() {
        const params = new URLSearchParams();
        params.set("theme", String(currentThemeIndex + 1));
        params.set("name", dom.nameInput.value.trim() || defaults.name);
        params.set("msg", dom.messageInput.value.trim() || defaults.message);
        const url = location.origin === "null"
          ? location.href.split("?")[0] + "?" + params.toString()
          : location.origin + location.pathname + "?" + params.toString();

        try {
          if (navigator.share) {
            await navigator.share({
              title: "كارت عيد الأضحى من PromptVaultAI.net",
              text: "كارت تهنئة عيد الأضحى المبارك",
              url
            });
            setStatus("تم فتح نافذة المشاركة.", "success");
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(url);
            setStatus("تم نسخ الرابط إلى الحافظة.", "success");
          } else {
            window.prompt("انسخ الرابط:", url);
          }
        } catch (error) {
          setStatus("لم تتم المشاركة، يمكنك المحاولة مرة أخرى.", "error");
        }
      }

      function resetAll() {
        dom.nameInput.value = defaults.name;
        dom.messageInput.value = defaults.message;
        dom.photoInput.value = "";
        dom.cardPhoto.removeAttribute("src");
        dom.cardPhoto.style.display = "none";
        dom.photoPlaceholder.style.display = "grid";
        dom.filePreview.removeAttribute("src");
        dom.filePreview.style.display = "none";
        updatePreviewText();
        setTheme(defaults.themeIndex);
        setStatus("تمت إعادة الضبط.", "success");
      }

      function applyParams() {
        const params = new URLSearchParams(location.search);
        const name = params.get("name");
        const message = params.get("msg");
        const theme = Number(params.get("theme"));

        if (name) {
          dom.nameInput.value = name.slice(0, 32);
        }
        if (message) {
          dom.messageInput.value = message.slice(0, 170);
        }
        if (Number.isFinite(theme) && theme >= 1 && theme <= themes.length) {
          currentThemeIndex = theme - 1;
        }
      }

      function bindEvents() {
        dom.nameInput.addEventListener("input", updatePreviewText);
        dom.messageInput.addEventListener("input", updatePreviewText);
        dom.photoInput.addEventListener("change", handlePhotoUpload);
        dom.prevThemeButton.addEventListener("click", () => setTheme(currentThemeIndex - 1));
        dom.nextThemeButton.addEventListener("click", () => setTheme(currentThemeIndex + 1));
        dom.randomThemeButton.addEventListener("click", () => {
          let next = Math.floor(Math.random() * themes.length);
          if (next === currentThemeIndex) {
            next = normalizeIndex(next + 1);
          }
          setTheme(next);
        });
        dom.downloadButton.addEventListener("click", downloadPng);
        dom.shareButton.addEventListener("click", shareCurrentLink);
        dom.resetButton.addEventListener("click", resetAll);
      }

      buildThemeButtons();
      applyParams();
      bindEvents();
      updatePreviewText();
      setTheme(currentThemeIndex);
    })();
  </script>
</body>
</html>
